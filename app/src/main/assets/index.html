<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>しりとりペイント</title>
<style>
  :root{--bg:#f7f3ea;--ink:#2d2a26;--mut:#8a8173;--line:#e2d9c8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  .scr{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
  .scr.on{display:flex}
  .wrap{width:100%;max-width:560px;margin:auto;padding:18px 16px;overflow-y:auto;max-height:100%}
  h1{font-size:26px;text-align:center;margin:4px 0 4px;letter-spacing:.05em}
  .lead{color:var(--mut);font-size:14px;text-align:center;margin:0 0 16px;line-height:1.6}
  .nums{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .nums button{padding:10px 0;border:2px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:17px;font-weight:800}
  .nums button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .names{margin-top:12px}
  .names div{display:flex;align-items:center;gap:8px;margin-top:8px}
  .names i{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
  .names input{flex:1;padding:10px;border:2px solid var(--line);border-radius:10px;font:inherit;font-size:16px}
  .btn{display:block;width:100%;margin-top:16px;padding:14px;border:none;border-radius:14px;background:var(--ink);color:#fff;font:inherit;font-size:17px;font-weight:800}
  .btn.sub{background:transparent;color:var(--ink);border:2px solid var(--ink);margin-top:10px;padding:11px;font-size:15px}
  /* ゲーム */
  #game{flex-direction:column}
  .head{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
  .who{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;min-width:0}
  .who i{width:22px;height:22px;border-radius:50%;flex:none}
  .who span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .need{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
  .need b{font-size:30px;color:var(--ink);background:#fff6d6;border:3px solid var(--ink);border-radius:12px;width:48px;height:48px;display:grid;place-items:center}
  .timer{height:6px;background:var(--line)} .timer i{display:block;height:100%;width:100%;background:#2bb673}
  .timer i.low{background:#e74c3c}
  .main{flex:1;display:flex;min-height:0}
  .boardBox{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;padding:8px}
  #board{touch-action:none;max-width:100%;max-height:100%}
  .side{display:flex;flex-direction:column;gap:6px;padding:8px 12px}
  .bars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 10px;font-size:12px}
  .bar{display:flex;align-items:center;gap:4px;min-width:0}
  .bar i{width:10px;height:10px;border-radius:50%;flex:none}
  .bar span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .bar.out span{text-decoration:line-through;color:#aaa}
  .last{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .last b{color:var(--ink);font-size:15px}
  .inrow{display:flex;gap:8px;padding:8px 12px 12px;background:#fff;border-top:1px solid var(--line)}
  .inrow input{flex:1;min-width:0;padding:12px;border:3px solid var(--ink);border-radius:12px;font:inherit;font-size:20px;font-weight:700}
  .inrow button{padding:0 18px;border:none;border-radius:12px;background:var(--ink);color:#fff;font:inherit;font-size:17px;font-weight:800}
  .err{color:#d63031;font-size:13px;min-height:18px;padding:0 12px;text-align:center}
  .shake{animation:sh .35s}
  @keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  /* 交代・お知らせ */
  .ov{position:fixed;inset:0;background:rgba(30,25,20,.6);display:none;align-items:center;justify-content:center;z-index:5}
  .ov.on{display:flex}
  .card{background:#fff;border-radius:22px;padding:24px 22px;text-align:center;width:min(86vw,360px)}
  .card .dot{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
  .card h2{margin:0 0 6px;font-size:22px}
  .card p{margin:4px 0;color:var(--mut)}
  .card .big{font-size:56px;font-weight:900;color:var(--ink);margin:6px 0}
  /* 結果 */
  .rank{margin-top:10px}
  .rank div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#fff;margin-top:6px;border:1px solid var(--line)}
  .rank b{width:2em;text-align:center;font-size:18px}
  .rank i{width:18px;height:18px;border-radius:50%;flex:none}
  .rank span{flex:1;font-weight:700}
  .rank em{font-style:normal;font-weight:800}
  #resBoard{display:block;margin:10px auto 0;max-width:100%;border-radius:10px}
  @media (orientation: landscape){
    .main{flex-direction:row}
    .side{width:34%;order:2;justify-content:center}
    .bars{grid-template-columns:repeat(2,1fr)}
  }
  @media (orientation: portrait){ .main{flex-direction:column} }
</style>
</head>
<body>

<!-- 準備 -->
<section class="scr on" id="setup">
  <div class="wrap">
    <h1>🎨 しりとりペイント</h1>
    <p class="lead">しりとりで使った文字のマスを、自分の色で塗りつぶす。<br>「ん」で終わるか、20秒答えられないと脱落。<br>最後に、塗った面積がいちばん広い人の勝ち！</p>
    <div class="nums" id="nums"></div>
    <div class="names" id="names"></div>
    <button class="btn" id="start">はじめる</button>
  </div>
</section>

<!-- ゲーム -->
<section class="scr" id="game">
  <div class="head">
    <div class="who"><i id="whoDot"></i><span id="whoName"></span></div>
    <div class="need">つぎは<b id="need"></b></div>
  </div>
  <div class="timer"><i id="timer"></i></div>
  <div class="main">
    <div class="boardBox" id="boardBox"><canvas id="board"></canvas></div>
    <div class="side">
      <div class="last" id="last"></div>
      <div class="bars" id="bars"></div>
    </div>
  </div>
  <div class="err" id="err"></div>
  <div class="inrow">
    <input id="word" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="ひらがなで入力">
    <button id="send">決定</button>
  </div>
</section>

<!-- 結果 -->
<section class="scr" id="result">
  <div class="wrap">
    <h1 id="resTitle"></h1>
    <canvas id="resBoard"></canvas>
    <div class="rank" id="rank"></div>
    <button class="btn" id="again">同じメンバーでもう一度</button>
    <button class="btn sub" id="toSetup">人数・名前を変える</button>
  </div>
</section>

<!-- 交代・脱落のお知らせ -->
<div class="ov" id="turnOv"><div class="card">
  <div class="dot" id="tDot"></div>
  <h2 id="tName"></h2>
  <p id="tMsg"></p>
  <div class="big" id="tNeed"></div>
  <button class="btn" id="tGo">スタート（20秒）</button>
</div></div>
<div class="ov" id="outOv"><div class="card">
  <h2 id="oTitle"></h2>
  <p id="oMsg"></p>
  <button class="btn" id="oGo">OK</button>
</div></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const R = () => Math.random();
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

// ================= 50音表 =================
// 行ごとに あ・い・う・え・お の段。空いているところは null
const ROWS = [
  ['あ','い','う','え','お'], ['か','き','く','け','こ'], ['さ','し','す','せ','そ'], ['た','ち','つ','て','と'],
  ['な','に','ぬ','ね','の'], ['は','ひ','ふ','へ','ほ'], ['ま','み','む','め','も'], ['や',null,'ゆ',null,'よ'],
  ['ら','り','る','れ','ろ'], ['わ',null,null,null,'を'], ['ん',null,null,null,null],
];
const COLORS = ['#e8453c','#2f80ed','#27ae60','#f2c94c','#9b51e0','#f2994a','#00b8b0','#eb5ca8'];
const LIMIT = 20000;

// 文字をそろえる：カタカナ→ひらがな、濁点・半濁点・小さい文字は元の文字に
const NORM = {'が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ','ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ','だ':'た','ぢ':'ち','づ':'つ','で':'て','ど':'と',
  'ば':'は','び':'ひ','ぶ':'ふ','べ':'へ','ぼ':'ほ','ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ','ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お',
  'っ':'つ','ゃ':'や','ゅ':'ゆ','ょ':'よ','ゎ':'わ','ゔ':'う','ゐ':'い','ゑ':'え'};
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const norm = c => NORM[c] || c;
function cleanWord(raw){ return toHira(raw.trim().replace(/\s/g, '')); }
// 最後の文字（「ー」は一つ前の文字。小さい文字は大きく）
function lastChar(w){
  let i = w.length - 1;
  while (i > 0 && w[i] === 'ー') i--;
  return norm(w[i]);
}

// ================= 盤面（縦向きは 行が縦、横向きは 行が横） =================
const board = $('board'), bctx = board.getContext('2d');
const paint = document.createElement('canvas'), pctx = paint.getContext('2d');   // 塗り（面積の計算にも使う）
const P = 2;              // 解像度の倍率
let cell = 60, land = false, cols = 5, rows = 11;
function cellPos(ch){
  for (let r = 0; r < ROWS.length; r++){ const c = ROWS[r].indexOf(ch); if (c >= 0) return land ? {x: r, y: c} : {x: c, y: r}; }
  return null;
}
function sizeBoard(){
  // キーボードで画面が縮んでも向きが変わらないよう、画面そのものの向きで判定
  land = (screen.width || innerWidth) > (screen.height || innerHeight);
  cols = land ? 11 : 5; rows = land ? 5 : 11;
  const box = $('boardBox').getBoundingClientRect();
  cell = Math.floor(Math.min((box.width - 16) / cols, (box.height - 16) / rows));
  cell = Math.max(18, cell);
  const w = cell * cols, h = cell * rows;
  board.style.width = w + 'px'; board.style.height = h + 'px';
  board.width = w * P; board.height = h * P;
}

// 塗りは「論理座標（列・行）」で記録しておき、向きが変わったら描き直す
let strokes = [];
function addPaint(ch, color){
  const seed = Math.floor(R() * 1e9);
  strokes.push({ch, color, seed});
}
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function renderPaint(){
  paint.width = board.width; paint.height = board.height;
  pctx.clearRect(0, 0, paint.width, paint.height);
  const c = cell * P;
  for (const st of strokes){
    const pos = cellPos(st.ch); if (!pos) continue;
    const r = rng(st.seed), cx = (pos.x + .5) * c, cy = (pos.y + .5) * c;
    pctx.fillStyle = st.color;
    // マスを大きなしずくでおおう
    for (let i = 0; i < 7; i++){
      const a = r() * Math.PI * 2, d = r() * c * .16;
      pctx.beginPath(); pctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, c * (.38 + r() * .14), 0, Math.PI * 2); pctx.fill();
    }
    // 飛び散ったしぶき（少しはみ出す）
    const n = 7 + Math.floor(r() * 7);
    for (let i = 0; i < n; i++){
      const a = r() * Math.PI * 2, d = c * (.45 + r() * .38), rr = c * (.03 + r() * .08);
      pctx.beginPath(); pctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, rr, 0, Math.PI * 2); pctx.fill();
      if (r() < .5){ const d2 = d * .78; pctx.beginPath(); pctx.ellipse(cx + Math.cos(a) * d2, cy + Math.sin(a) * d2, rr * .6, rr * 1.8, a + Math.PI / 2, 0, Math.PI * 2); pctx.fill(); }
    }
  }
}
function drawBoard(target = bctx, W = board.width, H = board.height, s = 1){
  const c = cell * P * s;
  target.setTransform(1, 0, 0, 1, 0, 0);
  target.fillStyle = '#fffdf8'; target.fillRect(0, 0, W, H);
  // マス目
  target.strokeStyle = '#e6dccb'; target.lineWidth = 2 * s;
  for (let r = 0; r < ROWS.length; r++) for (let k = 0; k < 5; k++){
    if (!ROWS[r][k]) continue;
    const x = (land ? r : k) * c, y = (land ? k : r) * c;
    target.strokeRect(x + 2, y + 2, c - 4, c - 4);
  }
  target.drawImage(paint, 0, 0, W, H);
  // 文字（塗りの上でも読めるように）
  target.font = `800 ${c * .46}px "Hiragino Sans","Noto Sans JP",sans-serif`; target.textAlign = 'center'; target.textBaseline = 'middle';
  for (let r = 0; r < ROWS.length; r++) for (let k = 0; k < 5; k++){
    const ch = ROWS[r][k]; if (!ch) continue;
    const x = ((land ? r : k) + .5) * c, y = ((land ? k : r) + .5) * c;
    target.lineWidth = c * .08; target.strokeStyle = 'rgba(255,255,255,.9)'; target.strokeText(ch, x, y + c * .02);
    target.fillStyle = '#3a342c'; target.fillText(ch, x, y + c * .02);
  }
  // 次の文字を強調
  if (G && G.need && target === bctx){
    const pos = cellPos(G.need);
    if (pos){ target.strokeStyle = '#2d2a26'; target.lineWidth = 5; target.setLineDash([10, 6]);
      target.strokeRect(pos.x * c + 4, pos.y * c + 4, c - 8, c - 8); target.setLineDash([]); }
  }
}
// 面積：塗りのピクセルを、いちばん近いプレイヤーの色に数える
function areas(){
  const d = pctx.getImageData(0, 0, paint.width, paint.height).data;
  const rgb = G.players.map(p => [parseInt(p.color.slice(1, 3), 16), parseInt(p.color.slice(3, 5), 16), parseInt(p.color.slice(5, 7), 16)]);
  const cnt = new Array(rgb.length).fill(0);
  for (let i = 0; i < d.length; i += 16){       // 4ピクセルに1つ見れば十分
    if (d[i + 3] < 128) continue;
    let best = 0, bd = 1e9;
    for (let k = 0; k < rgb.length; k++){ const a = d[i] - rgb[k][0], b = d[i + 1] - rgb[k][1], c = d[i + 2] - rgb[k][2], dd = a * a + b * b + c * c; if (dd < bd){ bd = dd; best = k; } }
    cnt[best]++;
  }
  const total = paint.width * paint.height / 4;
  return cnt.map(n => n / total * 100);
}

// ================= 準備 =================
let setup = load('setup', {count: 2, names: []});
function renderSetup(){
  $('nums').innerHTML = '';
  for (let i = 1; i <= 8; i++){
    const b = document.createElement('button'); b.textContent = i; b.className = i === setup.count ? 'on' : '';
    b.onclick = () => { readNames(); setup.count = i; renderSetup(); };
    $('nums').appendChild(b);
  }
  $('names').innerHTML = '';
  for (let i = 0; i < setup.count; i++){
    const d = document.createElement('div');
    d.innerHTML = `<i style="background:${COLORS[i]}"></i><input maxlength="10" placeholder="プレイヤー${i + 1}">`;
    d.querySelector('input').value = setup.names[i] || '';
    $('names').appendChild(d);
  }
}
function readNames(){ [...$('names').querySelectorAll('input')].forEach((x, i) => setup.names[i] = x.value.trim()); }
renderSetup();

// ================= ゲーム =================
let G = null, timerId = null, t0 = 0;
const START = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわ';
$('start').onclick = () => { readNames(); save('setup', setup); startGame(); };
function startGame(){
  G = {players: Array.from({length: setup.count}, (_, i) => ({name: setup.names[i] || `プレイヤー${i + 1}`, color: COLORS[i], out: false, words: 0})),
       turn: 0, need: START[Math.floor(R() * START.length)], used: new Set(), history: []};
  strokes = [];
  show('game'); sizeBoard(); renderPaint(); drawBoard(); updateUI();
  nextTurn(true);
}
function alive(){ return G.players.filter(p => !p.out); }
function cur(){ return G.players[G.turn]; }
function updateUI(){
  const p = cur();
  $('whoDot').style.background = p.color; $('whoName').textContent = p.name;
  $('need').textContent = G.need;
  const ar = areas();
  $('bars').innerHTML = G.players.map((q, i) => `<div class="bar ${q.out ? 'out' : ''}"><i style="background:${q.color}"></i><span>${esc(q.name)}</span><b>${ar[i].toFixed(1)}%</b></div>`).join('');
  const h = G.history.slice(-3).map(x => `<b style="color:${x.color}">${esc(x.word)}</b>`).join(' → ');
  $('last').innerHTML = h || '最初の文字から始めよう';
  drawBoard();
}
function nextTurn(first){
  if (!first){
    // 次の生きている人へ
    for (let k = 1; k <= G.players.length; k++){ const i = (G.turn + k) % G.players.length; if (!G.players[i].out){ G.turn = i; break; } }
  }
  const p = cur(); updateUI();
  $('tDot').style.background = p.color; $('tName').textContent = `${p.name} の番`;
  $('tMsg').textContent = '「' + G.need + '」から始まる言葉'; $('tNeed').textContent = G.need;
  $('turnOv').classList.add('on');
}
$('tGo').onclick = () => {
  $('turnOv').classList.remove('on');
  $('word').value = ''; $('err').textContent = '';
  setTimeout(() => $('word').focus(), 50);
  startTimer();
};
function startTimer(){
  stopTimer(); t0 = performance.now();
  const tick = () => {
    const left = Math.max(0, 1 - (performance.now() - t0) / LIMIT);
    $('timer').style.width = left * 100 + '%'; $('timer').classList.toggle('low', left < .3);
    if (left <= 0){ stopTimer(); eliminate('時間切れ……', `${cur().name} は20秒以内に答えられなかった。`); return; }
    timerId = requestAnimationFrame(tick);
  };
  timerId = requestAnimationFrame(tick);
}
function stopTimer(){ if (timerId) cancelAnimationFrame(timerId); timerId = null; }

function submit(){
  if (!timerId) return;
  const w = cleanWord($('word').value);
  const bad = msg => { $('err').textContent = msg; const r = $('word'); r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); };
  if (w.length < 2) return bad('2文字以上で入力してね');
  if (!/^[ぁ-ゖー]+$/.test(w)) return bad('ひらがな・カタカナで入力してね');
  if (w[0] === 'ー') return bad('「ー」から始まる言葉はダメ');
  if (norm(w[0]) !== G.need) return bad(`「${G.need}」から始まる言葉にしてね`);
  if (G.used.has(w)) return bad('その言葉は、もう使われています');
  stopTimer();
  const p = cur();
  G.used.add(w); G.history.push({word: w, color: p.color}); p.words++;
  // 単語に含まれる文字を全部塗る
  for (const ch of w){ if (ch === 'ー') continue; addPaint(norm(ch), p.color); }
  renderPaint();
  const end = lastChar(w);
  if (end === 'ん'){ updateUI(); setTimeout(() => eliminate('「ん」で終わった！', `${p.name} の「${w}」は「ん」で終わったので脱落。でも、塗ったペンキは残ります。`), 500); return; }
  G.need = end;
  updateUI();
  setTimeout(() => nextTurn(false), 450);
}
$('send').onclick = submit;
$('word').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) submit(); });

function eliminate(title, msg){
  const p = cur(); p.out = true; updateUI();
  $('oTitle').textContent = title; $('oMsg').textContent = msg;
  $('outOv').classList.add('on');
}
$('oGo').onclick = () => {
  $('outOv').classList.remove('on');
  const left = alive();
  if (left.length === 0 || (G.players.length > 1 && left.length === 1)) return finish();
  nextTurn(false);
};

function finish(){
  stopTimer();
  const ar = areas();
  const order = G.players.map((p, i) => ({p, a: ar[i]})).sort((x, y) => y.a - x.a);
  $('resTitle').textContent = `🏆 ${order[0].p.name} の勝ち！`;
  // 結果の盤面
  const rb = $('resBoard'), s = .6; rb.width = board.width * s; rb.height = board.height * s;
  rb.style.width = Math.min(innerWidth - 40, board.width / P) + 'px';
  drawBoard(rb.getContext('2d'), rb.width, rb.height, s);
  $('rank').innerHTML = order.map((o, i) => `<div><b>${i + 1}</b><i style="background:${o.p.color}"></i><span>${esc(o.p.name)}</span><em>${o.a.toFixed(1)}%</em></div>`).join('')
    + `<p class="lead" style="margin-top:10px">使われた言葉：${G.history.length}語</p>`;
  show('result');
}
$('again').onclick = startGame;
$('toSetup').onclick = () => { renderSetup(); show('setup'); };

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function show(id){ document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === id)); }
addEventListener('resize', () => { if ($('game').classList.contains('on')){ sizeBoard(); renderPaint(); drawBoard(); } });
